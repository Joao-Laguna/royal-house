<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Royal House · Admin do site</title>
<style>
:root{--bg:#0b0b0c;--pn:#131315;--p2:#1b1b1d;--tx:#efe9dc;--au:#d0aa55;--ln:#2a2825;--mu:#9d968a;--rd:#e07a6a}*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,sans-serif;padding:20px 16px 110px;max-width:760px}
h1{font:500 1.9rem Georgia,serif;margin:6px 0 4px}h2{font:600 .8rem Jost,system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--au);margin:30px 0 10px}p.s{color:var(--mu);margin:0 0 14px}
input,select,button{font:inherit;color:var(--tx);min-height:42px;border-radius:8px;border:1px solid var(--ln);background:var(--p2);padding:0 11px;color-scheme:dark;width:100%}button{cursor:pointer;width:auto}button:hover{border-color:var(--au)}
.pri{background:var(--au);color:#16120a;border:0;font-weight:600}.dg{color:var(--rd);border-color:#4a2a25}label{display:block;color:var(--mu);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin:8px 0 3px}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px}.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.f{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
#pub{position:fixed;left:0;right:0;bottom:0;background:#101011;border-top:1px solid var(--ln);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;gap:10px;align-items:center;justify-content:center}#pub .pri{padding:0 26px}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--p2);border:1px solid var(--au);padding:10px 16px;border-radius:10px;opacity:0;transition:.4s;pointer-events:none;max-width:90%;text-align:center}#ts.on{opacity:1}#ts.er{border-color:var(--rd)}
.th{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--p2)}@media(max-width:560px){.g{grid-template-columns:1fr}}
</style></head><body>
<div id="lg"><h1>Admin do site</h1><p class="s">Edite serviços, preços, equipe, avaliações e contatos. As mudanças são salvas direto no GitHub e o site atualiza em cerca de 1 minuto.</p>
<label>Repositório (usuario/nome-do-repo)</label><input id="rp" placeholder="seu-usuario/royal-house"><label>Token do GitHub</label><input id="tk" type="password" placeholder="github_pat_...">
<div class="f"><button class="pri" onclick="entrar()">Entrar</button></div><p class="s" style="margin-top:14px">O token fica só neste navegador e nunca vai pro site.</p></div>
<div id="ap" style="display:none"></div><div id="pub"><span class="s" style="margin:0" id="st">Alterações não publicadas</span><button class="pri" onclick="pub()">Publicar no site</button></div><div id="ts"></div>
<script>
const $=i=>document.getElementById(i),T=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let REPO,TK,D,SHA,DIRTY=0;
const GER=[["nome","Nome da barbearia"],["slogan","Frase de destaque"],["endereco","Endereço"],["cep","CEP"],["telefone","Telefone exibido"],["whatsapp","WhatsApp (55+DDD+número)"],["zaplink","Link do WhatsApp (wa.me/...)"],["instagram","Instagram (sem @)"],["agendar","Link de reserva (Booksy)"],["maps","Link do Google Maps"],["nota","Nota média (ex: 5,0)"],["total","Total de avaliações"]];
const SEC=[["itens","Serviços e preços",[["grupo","Categoria"],["nome","Nome"],["preco","Preço (só números, ex: 60 ou 239,90)"],["duracao","Duração (ex: 40 min)"],["desc","Descrição (opcional)"]],{grupo:"Cortes e barba",nome:"Novo serviço",preco:"0",duracao:"30 min",desc:""}],
["equipe","Equipe",[["nome","Nome"],["funcao","Função"],["instagram","Instagram (sem @)"],["@foto","Foto"]],{nome:"Novo barbeiro",funcao:"Barbeiro",instagram:"",foto:""}],
["galeria","Portfólio (fotos)",[["legenda","Legenda"],["@foto","Foto"]],{foto:"",legenda:"Nova foto"}],
["avaliacoes","Avaliações",[["nome","Nome do cliente"],["servico","Serviço"],["barbeiro","Barbeiro"],["texto","Comentário (opcional)"]],{nome:"",servico:"",barbeiro:"",texto:""}]];
const dec=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,""))));const enc=s=>btoa(unescape(encodeURIComponent(s)));
function toast(t,er){const e=$("ts");e.textContent=t;e.className="on"+(er?" er":"");clearTimeout(e.t);e.t=setTimeout(()=>e.className="",3200)}
async function gh(p,o={}){const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${p}`,{...o,headers:{Authorization:"Bearer "+TK,Accept:"application/vnd.github+json","Content-Type":"application/json"}});if(!r.ok)throw new Error(r.status);return r.json()}
$("rp").value=localStorage.rp||(location.hostname.endsWith("github.io")?location.hostname.split(".")[0]+"/"+location.pathname.split("/")[1]:"");$("tk").value=localStorage.tk||"";
async function entrar(){REPO=$("rp").value.trim();TK=$("tk").value.trim();try{const f=await gh("data.json");SHA=f.sha;D=JSON.parse(dec(f.content));localStorage.rp=REPO;localStorage.tk=TK;$("lg").style.display="none";$("ap").style.display="block";draw()}
catch(e){toast(e.message=="401"||e.message=="403"?"Token inválido ou sem permissão.":e.message=="404"?"Repositório ou data.json não encontrado.":"Erro ao conectar.",1)}}
const F=(k,l,v)=>`<div><label>${l}</label><input data-k="${k}" value="${T(v)}" ${k.endsWith(".grupo")?'list="gr"':""}></div>`;
const PH=(k,v)=>`<div class="f">${v?`<img class="th" src="img/${T(v)}" alt="">`:""}<span class="s" style="margin:0">Foto</span><input type="file" accept="image/*" style="display:none" onchange="up(this,'${k}')"><button type="button" onclick="this.previousElementSibling.click()">${v?"Trocar":"Enviar"}</button></div>`;
function draw(){$("ap").innerHTML=`<h1>Admin do site</h1><p class="s">${T(REPO)}</p><datalist id="gr">${[...new Set(D.itens.map(i=>i.grupo))].map(g=>`<option value="${T(g)}">`).join("")}</datalist><h2>Informações gerais</h2><div class="c g">${GER.map(x=>F(x[0],x[1],D[x[0]])).join("")}</div>`+
SEC.map(([k,t,fl,nv])=>`<h2>${t}</h2>${D[k].map((x,i)=>`<div class="c"><div class="g">${fl.filter(f=>f[0][0]!="@").map(f=>F(`${k}.${i}.${f[0]}`,f[1],x[f[0]])).join("")}</div>${fl.filter(f=>f[0][0]=="@").map(f=>PH(`${k}.${i}.${f[0].slice(1)}`,x[f[0].slice(1)])).join("")}<div class="f"><button class="dg" onclick="rm('${k}',${i})">Remover</button></div></div>`).join("")}<button onclick='add("${k}",${JSON.stringify(nv)})'>+ Adicionar</button>`).join("");$("pub").style.display=DIRTY?"flex":"none"}
function dirty(){DIRTY=1;$("pub").style.display="flex"}
function setp(k,v){const p=k.split(".");let o=D;while(p.length>1)o=o[p.shift()];o[p[0]]=v}
document.addEventListener("input",e=>{const k=e.target.dataset?.k;if(!k)return;setp(k,e.target.value);dirty()});
function add(t,o){D[t].push(o);dirty();draw()}function rm(t,i){if(confirm("Remover?")){D[t].splice(i,1);dirty();draw()}}
async function up(inp,k){const f=inp.files[0];if(!f)return;toast("Enviando foto...");try{const im=await createImageBitmap(f),s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
const b=c.toDataURL("image/jpeg",.85).split(",")[1],n="f"+Date.now()+".jpg";await gh("img/"+n,{method:"PUT",body:JSON.stringify({message:"Nova foto pelo admin",content:b})});setp(k,n);dirty();draw();toast("Foto enviada. Publique pra aparecer no site.")}catch(e){toast("Erro ao enviar a foto.",1)}}
async function pub(){$("st").textContent="Publicando...";try{const r=await gh("data.json",{method:"PUT",body:JSON.stringify({message:"Atualiza dados pelo admin",content:enc(JSON.stringify(D,null,1)),sha:SHA})});SHA=r.content.sha;DIRTY=0;$("pub").style.display="none";toast("Publicado! O site atualiza em cerca de 1 minuto.")}
catch(e){$("st").textContent="Alterações não publicadas";toast(e.message=="409"?"O arquivo mudou no GitHub. Recarregue a página e refaça.":"Erro ao publicar.",1)}}
</script></body></html>
